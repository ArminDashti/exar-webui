# Remote deploy settings — YAML only (no CLI -- flags).
# Behind HAProxy on t3-net: exar-webui:80 + exar-api:8080 (no host publish required).

stack_name: exar
image_tag: exar-web:latest
compose_file: ../../docker-compose.yml
dockerfile: ../../Dockerfile
docker_network: t3-net
internal_port: "8080"
publish_port: ""
delete_volume: "no"
delete_image: "yes"
build_image_on: "local"  # local = build here and upload; server = build on remote

ssh: "ssh t3"

volume_dir: "/home/cloud-admin/docker/exar"
